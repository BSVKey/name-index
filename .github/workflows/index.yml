name: Build BSVKey name index

on:
  schedule:
    - cron: "*/5 * * * *"      # every 5 minutes (GitHub may delay busy crons)
  workflow_dispatch: {}         # allow manual runs from the Actions tab

# Only one indexer run at a time, so two runs never race to push main.
concurrency:
  group: build-index
  cancel-in-progress: false

permissions:
  contents: write               # to commit the refreshed docs/names.json

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # full history so `git pull --rebase` works

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Restore the incremental tx cache so runs don't re-scan the whole registry
      - uses: actions/cache@v4
        with:
          path: .cache
          key: bsvkey-txcache

      - name: Build index
        env:
          NETWORK: main
          REGISTRY_ADDRESS: 1G6sLZX7FEsho13aei7iVygWaJhrSXDsrM
          WOC_API_KEY: ${{ secrets.WOC_API_KEY }}   # optional; add in repo Settings → Secrets for faster scans
        run: node scripts/build-index.js

      - name: Commit refreshed names.json
        run: |
          git config user.name "bsvkey-indexer"
          git config user.email "indexer@bsvkey.local"
          # names.json is a fully regenerated artifact, so a concurrent run's push
          # can never be "merged" with ours — rebasing it just conflicts (both runs
          # rewrite the same single line). Instead, on each attempt we move onto the
          # latest remote and re-place OUR freshly built file on top. Last writer
          # wins, no merge, no conflict — so overlapping runs can't fail the job.
          cp docs/names.json "$RUNNER_TEMP/names.json"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp "$RUNNER_TEMP/names.json" docs/names.json
            git add docs/names.json
            if git diff --cached --quiet; then
              echo "no changes (remote already current)"
              exit 0
            fi
            git commit -m "index: refresh names.json"
            if git push origin main; then
              echo "pushed"
              exit 0
            fi
            echo "push rejected, retrying ($i)..."
            sleep $((RANDOM % 5 + 2))
          done
          echo "push failed after retries"
          exit 1
